name: Windows Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Npcap SDK
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force third_party | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" `
            -OutFile "third_party/npcap-sdk-1.16.zip"
          Expand-Archive "third_party/npcap-sdk-1.16.zip" `
            -DestinationPath "third_party/npcap-sdk"

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DNPCAP_ROOT="${{ github.workspace }}/third_party/npcap-sdk"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: NetObserver-windows-x64
          path: |
            build/Release/NetObserver.exe
            build/Release/netobserver-cli.exe
            README.md

